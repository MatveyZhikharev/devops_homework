name: app

services:
  # Backend: plain nginx serving a static "Hello World" page.
  # No published ports — reachable only through the proxy over app-net.
  app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Reverse proxy: the only container exposed to the outside, on port 80
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

# Separate from tf-nginx-net (172.30.0.0/24) created by Terraform
networks:
  app-net:
    name: app-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
