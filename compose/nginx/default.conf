server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS. With a variable in proxy_pass nginx re-resolves
    # "app" at request time, so a re-created app container (new IP) keeps
    # working without restarting the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:80;

    # Same endpoint as the host nginx this stack replaces on port 80,
    # in case an external check relies on it
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
