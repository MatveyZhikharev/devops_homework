---
# sshd uses the first value it reads for each option and includes sshd_config.d/*.conf
# in lexical order, so this file must sort before 01-lab.conf and 50-cloud-init.conf,
# which both set PasswordAuthentication yes
- name: Disable password and root SSH login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible (role ssh_hardening)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
